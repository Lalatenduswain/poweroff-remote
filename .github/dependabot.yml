version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
    ignore:
      # AGP 9 and Gradle 9 need compileSdk 37 and a migration, not a version bump — see the note
      # at the top of gradle/libs.versions.toml. Re-open these deliberately when that work starts.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]
      # These two are what actually pin the androidx group: Compose 1.12 (BOM 2026.08) and
      # core-ktx 1.18+ both demand compileSdk 37. Ignoring just them lets the rest of the group
      # keep updating instead of the whole PR failing on one member.
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">=2025.10"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.18"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
