name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install the SDK pieces this project pins
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # The SSH integration tests need a real sshd. Running one on the runner itself keeps them
      # honest without depending on a service container's shell being complete enough for
      # `kill -9 $$` and friends.
      - name: Start an sshd for the integration tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo systemctl start ssh || sudo service ssh start
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t rsa -b 3072 -N '' -f ~/.ssh/ci_key
          cat ~/.ssh/ci_key.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/ci_key \
            127.0.0.1 'echo sshd is up as $(id -un)'

      - name: Unit tests, including SSH against that sshd
        run: |
          set -euo pipefail
          FP=$(ssh-keyscan 127.0.0.1 2>/dev/null | ssh-keygen -lf - | awk '{print $2}' | paste -sd,)
          echo "expecting one of: $FP"
          ./gradlew :app:testDebugUnitTest \
            -Ppoweroff.itHost=127.0.0.1 \
            -Ppoweroff.itUser="$(id -un)" \
            -Ppoweroff.itKey="$HOME/.ssh/ci_key" \
            -Ppoweroff.itFingerprint="$FP"

      # A green build proves nothing if the integration tests skipped themselves.
      - name: Summarise tests and refuse silent skips
        if: always()
        run: python3 scripts/test-summary.py --require-all

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build app and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  # The Keystore cannot be faked on a JVM, so these tests need a real Android runtime. An emulator
  # matrix reaches version branches no single phone can: 26 is the minSdk floor, 29 sits inside
  # AppLock's 28..29 exclusion band, 31 is where securityLevel() switches off the deprecated
  # isInsideSecureHardware, and 36 is the current target.
  instrumented:
    name: Vault tests on API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 31, 36]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # GitHub-hosted runners ship KVM but do not expose it to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented suite
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Logcat has to be pulled from inside this script: once the action tears the emulator
          # down there is no device left, and `adb logcat` then blocks forever waiting for one.
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest
            status=$?
            adb logcat -d > logcat-api-${{ matrix.api-level }}.txt 2>&1
            echo "--- key security level reported by this emulator ---"
            grep -F "key security level" logcat-api-${{ matrix.api-level }}.txt | tail -3
            exit $status

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logcat-api-${{ matrix.api-level }}.txt
          retention-days: 7
